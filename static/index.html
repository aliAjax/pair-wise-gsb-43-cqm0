<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1280px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.fail{color:#b3261e}.pending{color:#a86400}.ok{color:#1c7a4d}code{background:#edf0f2;padding:2px 5px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">开标采用可恢复批次：采购员发起批次后，监标人和审计员分别核对同一批承诺哈希，两方都通过才统一开标；任一不符整批停在待核并记录差异。项目详情、本页与审计记录使用同一批次号。历史无批次号数据按未见证回填。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>开标批次号</th><th>批次状态</th><th>监标确认</th><th>审计确认</th><th>失败原因</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th><th>开标批次号</th><th>见证状态</th></tr></thead><tbody></tbody></table>
<script>
function esc(s){return s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function batchClass(s){return s==='failed'?'fail':(s==='pending'?'pending':(s==='opened'?'ok':''))}
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td><code>${esc(r.open_batch_no)||'—'}</code></td><td class="${batchClass(r.open_batch_status)}">${esc(r.open_batch_status_label)||'—'}</td><td>${esc(r.open_batch_confirmers&&r.open_batch_confirmers.supervisor)||'—'}</td><td>${esc(r.open_batch_confirmers&&r.open_batch_confirmers.auditor)||'—'}</td><td class="fail">${esc(r.open_batch_failure_reason)||''}</td><td>${r.version}</td></tr>`).join('');
  document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${esc(r.status)}</td><td><code>${esc(r.payload_hash?r.payload_hash.slice(0,12)+'…':'')}</code></td><td>${esc(r.open_batch_no)||'—'}</td><td>${esc(r.witness_status)||'—'}</td></tr>`).join('')
}
load()
</script></html>
