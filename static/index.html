<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1280px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px;vertical-align:top}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.bad{color:#a33;font-weight:600}.ok{color:#23845b;font-weight:600}code{background:#edf0f2;padding:2px 5px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">开标须由采购员发起批次，监标人、审计员分别核对同一批承诺哈希，两方通过后才统一开标；任一不符整批停在待核。写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th><th>开标批次 / 确认人 / 失败原因</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th><th>开标批次</th><th>见证状态</th></tr></thead><tbody></tbody></table>
<script>
const witnessLabel={witnessed:'已见证',unwitnessed:'未见证（历史回填）',pending:'待核'};
const batchStatus={pending:'待核',disputed:'核对不符，整批暂停',witnessed:'两方已确认，已开标',unwitnessed:'未见证（历史回填）'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function batchCell(b){if(!b)return '—';const cls=b.status==='witnessed'?'ok':'bad';return `<span class="${cls}">${esc(b.batch_no)}｜${esc(batchStatus[b.status]||b.status)}</span><br>采购员：${esc(b.initiated_by)}<br>监标人：${esc(b.supervisor_confirmed_by||'待核')}｜审计员：${esc(b.auditor_confirmed_by||'待核')}${b.failure_reason?`<br><span class="bad">失败原因：${esc(b.failure_reason)}</span>`:''}`}
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td>${r.evaluation_round}</td><td>${r.version}</td><td>${batchCell(r.open_batch)}</td></tr>`).join('');
  document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${esc(r.status)}</td><td><code>${esc(r.payload_hash.slice(0,12))}…</code></td><td>${esc(r.open_batch_no||'—')}</td><td>${esc(witnessLabel[r.witness_status]||r.witness_status||'—')}</td></tr>`).join('');
}
load()</script></html>
